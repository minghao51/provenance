services:
  provenance-api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env.example
    volumes:
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"

  provenance-cli:
    build: .
    profiles:
      - cli
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: detect --file /app/data/input.txt --output json
